# One command: docker compose up --build
# Redpanda is a Kafka-compatible broker, so the services use the normal Kafka protocol.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  intake:
    build: .
    command: ["node", "dist/entry/intake.js"]
    environment:
      KAFKA_BROKERS: redpanda:9092
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      redpanda: { condition: service_healthy }

  triage:
    build: .
    command: ["node", "dist/entry/triage.js"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }

  capacity:
    build: .
    command: ["node", "dist/entry/capacity.js"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }

  notifications:
    build: .
    command: ["node", "dist/entry/notifications.js"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }
